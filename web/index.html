<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css?v=2026.11.18.6">
  <title>Wearlog</title>

<body>
  <header class="app-header">
    <a class="brand" href="/">Wearlog</a>
    <div class="header-tools">
      <span id="status" class="save-status" role="status" data-state="loading">Opening…</span>
      <button id="signin" class="secondary" hidden>Sign in to sync</button>
      <button id="settings" class="icon-button" aria-label="Settings"><svg
  aria-hidden="true"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" />
</svg>
</button>
    </div>
  </header>
  <div id="app-update" class="update-notice" role="status" hidden><span>App update available</span><button id="install-update" class="secondary">Update &amp; reload</button></div>
  <main>
    <section id="wardrobe-bar" class="wardrobe-bar" aria-label="Wardrobes" hidden>
      <select id="wardrobe-select" aria-label="Active wardrobe"></select>
      <button id="manage-wardrobe" class="secondary">Manage</button>
      <button id="create-wardrobe" class="secondary">New wardrobe</button>
    </section>
    <section id="onboarding" class="empty" hidden>
      <h1>Create your first wardrobe</h1>
      <p>Give your wardrobe a name. You can share it later.</p>
      <button id="first-wardrobe" class="primary">Name your wardrobe</button>
    </section>
    <section id="wardrobe-content" aria-label="Active wardrobe" hidden>
    <div class="page-heading"><div><h1 id="wardrobe-title">Wardrobe</h1><p id="total" class="muted"></p></div><button id="add" class="primary"><span aria-hidden="true">+</span> Add garment</button></div>
    <div class="controls"><label class="group-filter"><span class="sr-only">Wash group</span><select id="filter" aria-label="Wash group"><option value="">All groups</option></select></label><button id="wash" class="secondary">Wash a load</button></div>
    <section id="grid" class="grid" aria-label="Garments"></section>
    </section>
  </main>
  <dialog id="dialog">
    <form id="form">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" class="icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div id="dialog-content"></div>
      <p id="form-error" role="alert"></p>
      <div id="dialog-actions"></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js?v=2026.11.18.6"></script>
</body>
</html>

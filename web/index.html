<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Wearlog</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Wearlog</a>
    <div class="header-tools">
      <span id="status" class="save-status" role="status" data-state="loading">Opening…</span>
      <button id="signin" class="secondary" hidden>Sign in to sync</button>
      <button id="settings" class="icon-button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1-2-2z"/><circle cx="11.5" cy="10.5" r="3"/></svg></button>
    </div>
  </header>
  <main>
    <div class="page-heading"><div><h1>Wardrobe</h1><p id="total" class="muted"></p></div><button id="add" class="primary"><span aria-hidden="true">+</span> Add garment</button></div>
    <div class="controls"><label class="group-filter"><span class="sr-only">Wash group</span><select id="filter" aria-label="Wash group"><option value="">All groups</option></select></label><button id="wash" class="secondary">Wash a load</button></div>
    <section id="grid" class="grid" aria-label="Garments"></section>
  </main>
  <dialog id="dialog">
    <form id="form">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" class="icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div id="dialog-content"></div>
      <p id="form-error" role="alert"></p>
      <div id="dialog-actions"></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
